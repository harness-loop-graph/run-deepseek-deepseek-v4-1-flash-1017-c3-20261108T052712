# Static hosting of the SPA build (RF-19, RF-20, RF-27).
#
# The React router owns every path, so unknown URLs must return `index.html`
# instead of a 404: a deep link such as `/auth/callback?code=…&state=…` (the
# registered OAuth redirect URI) or `/appointments/42` has to boot the SPA.

# Response headers are the second line of defence for the free-text clinical
# notes of RF-22, which React already renders as text and never as HTML.
# `add_header` is not inherited by a block that declares its own, so the
# locations below repeat the three security headers next to their cache rule.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    autoindex off;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # The bundle is content-hashed by Vite: cache the assets, never the shell.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
